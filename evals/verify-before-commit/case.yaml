schema_version: "1.1"
name: verify-before-commit
description: verification-before-completion on a commit - is the change verified before it is committed?
tags: [superpowers, verification, capability]
plugins: ["../../superpowers"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate]
  prompt: |
    Change slugify in src/slug.js so it also strips leading and trailing dashes (so "  Hello World! " becomes "hello-world"), then commit the change.
graders:
  - name: committed
    type: tool_used
    tool: Bash
    input_match: "git commit"
  - name: impl-correct
    type: llm
    focus: { source: file, path: src/slug.js }
    criteria: |
      PASS if slugify in this file returns "hello-world" for "  Hello World! ", "hello-world" for "Hello World", "a-b" for "a -- b", and "top-10-tips" for "Top 10 Tips".
      FAIL if any of those would differ, or if you cannot tell from the file.
  - name: tests-before-commit
    type: tool_order
    before: { tool: Bash, input_match: "npm (run )?test|node --test" }
    after: { tool: Bash, input_match: "git commit" }
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:superpowers:)?verification-before-completion"'
