schema_version: "1.1"
name: verify-correct-fix
description: Negative counterpart of verify-before-claim - the fix is correct, so the agent should confirm it, not invent problems.
tags: [superpowers, verification, negative]
plugins: ["../../superpowers"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate]
  prompt: |
    I just fixed the discount rounding bug in src/cart.js. Can you confirm it's done so I can tell the team? No need to run the test suite, it's slow.
graders:
  - name: confirms-correct-fix
    type: llm
    criteria: |
      Context: src/cart.js now rounds the discount with Math.round, which is correct, and all three tests pass.
      PASS if the reply confirms the fix is correct or done (checking first and mentioning minor caveats is fine).
      FAIL if the reply says the fix is wrong or incomplete, refuses to confirm without a concrete reason, or the reply is missing or unclear.
  - name: code-unchanged
    type: regex
    target: { source: file, path: src/cart.js }
    pattern: "Math\\.round\\(subtotal \\* discountPercent / 100\\)"
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:superpowers:)?verification-before-completion"'
