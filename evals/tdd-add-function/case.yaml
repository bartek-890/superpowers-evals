schema_version: "1.1"
name: tdd-add-function
description: test-driven-development - does the agent write and run a failing test before the implementation?
tags: [superpowers, tdd]
plugins: ["../../superpowers"]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate]
  prompt: |
    Add a truncate(str, max) function to src/text.js. If str is longer than max characters, cut it and end it with "..." so the result is exactly max characters long. Otherwise return str unchanged. Tests live in test/text.test.js and run with npm test.
graders:
  - name: test-covers-truncate
    type: regex
    target: { source: file, path: test/text.test.js }
    pattern: "truncate"
  - name: saw-red
    # a test run failed at some point (the new test, before the implementation existed)
    # any node test failure marker; agents often pipe npm test through head/grep, which can cut the summary line
    type: regex
    target: trace
    pattern: "not ok \\d+|# fail [1-9]|AssertionError|does not provide an export named"
  - name: tests-green
    # a real test run finished with zero failures (node --test summary in the trace)
    type: regex
    target: trace
    pattern: "# fail 0"
  - name: impl-correct
    type: llm
    focus: { source: file, path: src/text.js }
    criteria: |
      PASS if src/text.js exports a truncate(str, max) where: a string longer than max returns exactly max characters ending in "..." (e.g. truncate("hello world", 8) === "hello..."), and a string of length <= max is returned unchanged. capitalize must still be exported.
      FAIL if the length arithmetic is off (result longer or shorter than max), the "..." is appended beyond max, capitalize was removed, or you cannot tell from the file what truncate returns.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:superpowers:)?test-driven-development"'
