schema_version: "1.1"
name: control-simple-question
description: Control - a factual one-liner no superpowers skill targets. Measures overhead (cost, turns, skill calls) and whether the answer stays short and right.
tags: [superpowers, control]
plugins: ["../../superpowers"]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate]
  prompt: |
    In git, what's the difference between git reset --soft HEAD~1 and git reset --hard HEAD~1? Two or three sentences.
graders:
  - name: correct-and-brief
    type: llm
    criteria: |
      PASS if the reply says --soft moves HEAD back one commit and keeps the changes staged (index and working tree kept), while --hard moves HEAD back and discards the changes from the index and working tree; and the answer is at most about four sentences, with no questions back to the user.
      FAIL if either explanation is wrong, the reply asks a clarifying question instead of answering, or it runs well beyond four sentences.
