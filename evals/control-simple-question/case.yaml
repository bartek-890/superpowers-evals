schema_version: "1.1"
name: control-simple-question
description: Control - a factual one-liner no superpowers skill targets. Measures overhead (cost, turns, skill calls) and whether the answer stays short and right.
tags: [superpowers, control]
plugins: ["../../superpowers"]
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite, TaskCreate, TaskGet, TaskList, TaskUpdate]
  prompt: |
    In git, what's the difference between git reset --soft HEAD~1 and git reset --hard HEAD~1? Two or three sentences.
graders:
  - name: correct-and-brief
    type: llm
    criteria: |
      PASS if the reply correctly says both commands move the branch back one commit, --soft keeps the undone commit's changes (staged), and --hard discards them from the working tree; and the reply is five sentences or fewer and does not ask the user a question.
      FAIL if either command is described wrongly, the reply asks the user a question, it is longer than five sentences, or the reply is missing or unclear.
